
server:
  port: 8080

app:
  gateway:
    backend-uri: https://httpbin.org

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: api-backend
              uri: ${app.gateway.backend-uri}
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
